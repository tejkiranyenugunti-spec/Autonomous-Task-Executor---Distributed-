global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: ate-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]

  - job_name: ate-dispatcher
    metrics_path: /metrics
    static_configs:
      - targets: ["dispatcher:8081"]

  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]
